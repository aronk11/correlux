# GoReleaser builds the cross-platform binaries Correlux ships.
#
# Correlux is a single static binary on purpose: installing an operations tool
# must never require a runtime, a container or a package manager.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: correlux
    main: ./cmd/correlux
    binary: correlux
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/aronk11/correlux/internal/buildinfo.Version={{ .Version }}
      - -X github.com/aronk11/correlux/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/aronk11/correlux/internal/buildinfo.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, NOTICE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  # Built from the commit messages, which is where the information is: the
  # groups below match Conventional Commit prefixes. Using git rather than the
  # GitHub API also means `task dist` produces the same artefacts offline, and
  # without a token, as CI does.
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Performance
      regexp: '^perf'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude: ['^docs', '^test', '^ci', '^chore']
