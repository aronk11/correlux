apiVersion: v1
kind: Config
current-context: staging
clusters:
  - name: prod-eu
    cluster:
      server: https://api.prod-eu.example.com
  - name: staging
    cluster:
      server: https://api.staging.example.com
  - name: internal
    cluster:
      server: https://api.live.internal.example.com
contexts:
  - name: prod-eu
    context:
      cluster: prod-eu
      user: admin
      namespace: payments
  - name: staging
    context:
      cluster: staging
      user: dev
  - name: sandbox
    context:
      cluster: internal
      user: dev
      namespace: sandbox
users:
  - name: admin
    user: {}
  - name: dev
    user: {}
