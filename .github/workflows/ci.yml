name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A dependency becomes vulnerable while nobody is pushing, so govulncheck
  # runs overnight on its own. Every other job here answers a question about a
  # change and has nothing to say without one, which is why they are all
  # guarded against this trigger.
  schedule:
    - cron: "0 4 * * *"

# Cancel superseded runs: a force-push should not keep burning minutes on the
# commit it replaced. The event is part of the group because the nightly run
# shares main's ref with pushes to it, and must never cancel a run that is
# checking a commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The module's minimum, and what every job that is not the version matrix
  # builds with.
  GO_VERSION: "1.26"
  TASK_VERSION: v3.53.1
  GOLANGCI_VERSION: v2.13.2

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26"]
        include:
          # One job on the current Go release. It is deliberately not the whole
          # matrix: the floor in go.mod is what users build with, and finding
          # out that a newer toolchain works is worth one runner, while raising
          # that floor stays a decision somebody makes rather than something a
          # Go release forces.
          - os: ubuntu-latest
            go: "1.27"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Build
        run: go build -trimpath ./...

      # The race detector needs a C toolchain, which the Windows runner does
      # not ship by default; the other two platforms cover the shared code.
      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      - name: Test
        if: runner.os == 'Windows'
        run: go test -shuffle=on ./...

      # One profile, from the job that builds the way users do. The same
      # coverage measured on three runners is three artifacts nobody can
      # compare, and the number would differ only by what is skipped per OS.
      - name: Upload the coverage profile
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  lint:
    name: lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          args: --build-tags integration

  tidy:
    name: go mod tidy is clean
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go mod tidy
      - name: Fail if go.mod or go.sum changed
        run: git diff --exit-code -- go.mod go.sum

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # The release workflow only ever runs on a tag, so until now a mistake in
  # .goreleaser.yaml was discovered by pushing one and watching it fail — and a
  # tag cannot be taken back once anybody has fetched it. Two of the last three
  # releases died that way, both in pipes that run after the binaries are
  # already built.
  #
  # --snapshot rehearses the same configuration on an untagged commit: it
  # builds every target, archives them, writes the packages and renders the
  # Homebrew cask, which is where both of those failures were. It publishes
  # nothing and needs no token, so it is safe on a pull request from a fork.
  release-dry-run:
    name: release dry run
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser reads the tag history to stamp the snapshot version.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # The SBOM pipe shells out to syft and runs in snapshot mode too, so a dry
      # run without it stops before it reaches the pipes that have been
      # breaking. cosign is deliberately absent: the dry run skips signing,
      # which is the one part of the release a pull request cannot rehearse —
      # a keyless signature needs an OIDC identity that fork pull requests are
      # not given, and it would write a transparency-log entry per CI run.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # Installed exactly as release.yml installs it — the same action, at the
      # same pinned version, fetching the same prebuilt binary. Rehearsing the
      # release with a differently built GoReleaser would not be rehearsing it.
      #
      # Not `go install` via the Taskfile: GoReleaser v2.18 needs Go 1.27 to
      # build from source, this repository's floor is Go 1.26, and setup-go
      # pins GOTOOLCHAIN=local so the toolchain cannot silently upgrade. The
      # local `task dist:snapshot` runs the same flags for contributors, whose
      # default GOTOOLCHAIN is free to fetch what the tool needs.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "v2.18.2"
          args: release --clean --snapshot --skip=publish,announce,sign

  integration:
    name: integration (kind, kubernetes ${{ matrix.kubernetes }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Correlux reads a cluster through discovery and the Table API, so the
        # axis that can break it is the Kubernetes version, not the operating
        # system the binary runs on. These are the current release and the two
        # before it, which is the window docs/stability.md promises.
        #
        # The images are digest-pinned from the kind v0.33.0 release notes: a
        # tag alone lets the node image move under a rerun of a commit that
        # once passed, which turns a green run into an unreproducible one.
        include:
          - kubernetes: v1.37.0
            image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          - kubernetes: v1.36.4
            image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - kubernetes: v1.35.8
            image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      # The same variable works locally, so a failing matrix entry is
      # reproducible with one command rather than by editing this file.
      - name: Create the kind cluster
        run: task kind:up KIND_NODE_IMAGE=${{ matrix.image }}

      # A modest load in CI: enough to exercise pagination, the Table API and
      # CRD discovery without turning every pull request into a 10-minute job.
      # The full 10k-object run is the scheduled load workflow.
      - name: Seed the cluster
        run: task kind:seed -- --namespaces 10 --apps-per-namespace 5 --pods-per-app 4 --crds 3 --custom-resources 50

      - name: Integration tests
        run: task test:integration

      - name: Cluster diagnostics on failure
        if: failure()
        run: |
          task kind:kubeconfig
          kubectl --kubeconfig .tools/kind.kubeconfig get nodes -o wide || true
          kubectl --kubeconfig .tools/kind.kubeconfig get pods -A | head -50 || true

      - name: Delete the kind cluster
        if: always()
        run: task kind:down

  hygiene:
    name: commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conventional Commits and signatures
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ./scripts/check-conventional-commits.sh
          ./scripts/check-signed-commits.sh
