name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs: a force-push should not keep burning minutes on the
# commit it replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  TASK_VERSION: v3.53.1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build
        run: go build -trimpath ./...

      # The race detector needs a C toolchain, which the Windows runner does
      # not ship by default; the other two platforms cover the shared code.
      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race -shuffle=on ./...

      - name: Test
        if: runner.os == 'Windows'
        run: go test -shuffle=on ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2
          args: --build-tags integration

  tidy:
    name: go mod tidy is clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go mod tidy
      - name: Fail if go.mod or go.sum changed
        run: git diff --exit-code -- go.mod go.sum

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  integration:
    name: integration (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      - name: Create the kind cluster
        run: task kind:up

      # A modest load in CI: enough to exercise pagination, the Table API and
      # CRD discovery without turning every pull request into a 10-minute job.
      # The full 10k-object run is the scheduled load workflow.
      - name: Seed the cluster
        run: task kind:seed -- --namespaces 10 --apps-per-namespace 5 --pods-per-app 4 --crds 3 --custom-resources 50

      - name: Integration tests
        run: task test:integration

      - name: Cluster diagnostics on failure
        if: failure()
        run: |
          task kind:kubeconfig
          kubectl --kubeconfig .tools/kind.kubeconfig get nodes -o wide || true
          kubectl --kubeconfig .tools/kind.kubeconfig get pods -A | head -50 || true

      - name: Delete the kind cluster
        if: always()
        run: task kind:down

  hygiene:
    name: commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Conventional Commits and signatures
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ./scripts/check-conventional-commits.sh
          ./scripts/check-signed-commits.sh
