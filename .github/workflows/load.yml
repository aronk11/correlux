name: Load

# The large-cluster benchmarks. They take minutes, so they run nightly and on
# demand rather than on every pull request — but they run, because
# "responsive on large clusters" is a claim that has to be measured.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      pods:
        description: Total pods to create
        default: "10000"

permissions:
  contents: read

jobs:
  load:
    name: large-cluster benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
      - run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - name: Create the kind cluster
        run: task kind:up

      - name: Seed ${{ inputs.pods || '10000' }} pods
        run: |
          task kind:seed -- \
            --namespaces 50 \
            --apps-per-namespace 20 \
            --pods-per-app $(( ${{ inputs.pods || 10000 }} / 1000 )) \
            --crds 5 \
            --custom-resources 500

      - name: Benchmarks
        run: task bench:cluster | tee bench.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks
          path: bench.txt

      - name: Delete the kind cluster
        if: always()
        run: task kind:down
