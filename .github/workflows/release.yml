name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the GitHub release and upload artefacts
      # Keyless signing and provenance both work by asking GitHub for a
      # short-lived OIDC token that says which workflow, in which repository,
      # at which ref is running. That token is the identity in the certificate,
      # which is why no private key has to exist anywhere.
      id-token: write
      attestations: write # record the provenance attestation for this release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      # Both tools have to be on PATH before GoReleaser runs: it shells out to
      # them per artefact rather than implementing either itself.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Provenance is the other half of the question a signature answers. The
      # signature says the release came from this workflow; the attestation
      # says which commit, which workflow run and which inputs produced each
      # file, and `gh attestation verify` checks it without anybody having to
      # know what a certificate identity is.
      #
      # It runs after the release rather than before it because it attests the
      # artefacts GoReleaser actually built.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
