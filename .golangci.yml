# golangci-lint v2 configuration.
#
# The linter set is chosen to catch the failure modes that actually hurt a
# long-running terminal application against a remote API: ignored errors,
# leaked contexts, unchecked type assertions and accidental blocking. Style
# bikeshedding is left to the formatters.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # an unclosed response body leaks a connection per request
    - contextcheck # every Kubernetes call must carry a cancellable context
    - copyloopvar
    - durationcheck
    - errorlint # %w and errors.Is/As, so error classification keeps working
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx # no HTTP request without a context
    - perfsprint
    - prealloc
    - revive
    - rowserrcheck
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - fieldalignment # readability of small structs beats a few padding bytes
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: indent-error-flow
        - name: unreachable-code
    gocritic:
      enabled-tags: [diagnostic, performance]
      disabled-checks:
        - evalOrder # `return m, m.handle(msg)` is the idiomatic Bubble Tea shape
      settings:
        hugeParam:
          # Startup structs (Options, Config) are passed once; only flag values
          # large enough to matter in a per-frame or per-item path.
          sizeThreshold: 256
        rangeValCopy:
          sizeThreshold: 256
    gosec:
      excludes:
        - G104 # duplicate of errcheck

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # Test code may take shortcuts that production code may not.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
          - prealloc

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/akiesel/kubeui
